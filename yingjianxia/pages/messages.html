/* 硬件侠 Design Tokens - 深色科技风 */

:root {
  /* Base primitives */
  --brand-bg: #0B0C10;
  --brand-surface: #15161A;
  --brand-surface-2: #1E2026;
  --brand-surface-3: #252830;

  --brand-ink: #F0F1F5;
  --brand-ink-2: #9CA3AF;
  --brand-ink-3: #6B7280;

  --brand-line: #2A2D35;
  --brand-line-subtle: rgba(255, 255, 255, 0.06);

  --brand-primary: #00D4AA;
  --brand-primary-hover: #00B894;
  --brand-primary-subtle: rgba(0, 212, 170, 0.12);

  --brand-primary-ink: #0B0C10;

  /* State colors */
  --brand-state-success: #10B981;
  --brand-state-success-subtle: rgba(16, 185, 129, 0.12);
  --brand-state-warning: #F59E0B;
  --brand-state-warning-subtle: rgba(245, 158, 11, 0.12);
  --brand-state-error: #EF4444;
  --brand-state-error-subtle: rgba(239, 68, 68, 0.12);
  --brand-state-info: #3B82F6;
  --brand-state-info-subtle: rgba(59, 130, 246, 0.12);

  /* Radius */
  --brand-radius-xs: 2px;
  --brand-radius-sm: 4px;
  --brand-radius-md: 8px;
  --brand-radius-lg: 16px;
  --brand-radius-pill: 999px;

  /* Shadow - reserved for floating layers */
  --brand-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.24), 0 1px 1px rgba(0, 0, 0, 0.16);
  --brand-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.45);
  --brand-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.60);

  /* Typography */
  --brand-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --brand-font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", Consolas, monospace;

  /* Spacing (8pt grid) */
  --brand-space-1: 4px;
  --brand-space-2: 8px;
  --brand-space-3: 12px;
  --brand-space-4: 16px;
  --brand-space-5: 24px;
  --brand-space-6: 32px;
  --brand-space-7: 48px;
  --brand-space-8: 80px;
  --brand-space-9: 120px;
}

/* Semantic aliases for apply-html-head-contract */
:root {
  --brand-background: var(--brand-bg);
  --brand-foreground: var(--brand-ink);

  --brand-card: var(--brand-surface);
  --brand-card-foreground: var(--brand-ink);

  --brand-popover: var(--brand-surface-2);
  --brand-popover-foreground: var(--brand-ink);

  --brand-primary: var(--brand-primary);
  --brand-primary-foreground: var(--brand-primary-ink);

  --brand-muted: var(--brand-surface-2);
  --brand-muted-foreground: var(--brand-ink-2);

  --brand-border: var(--brand-line);
  --brand-input: var(--brand-line);
  --brand-ring: var(--brand-primary);

  --brand-radius-md: var(--brand-radius-md);
}

/* Page-level base styles */
html.brand-light,
html.brand-dark {
  background-color: var(--brand-bg);
  color: var(--brand-ink);
  font-family: var(--brand-font-sans);
}

body {
  background-color: var(--brand-bg);
  color: var(--brand-ink);
  font-family: var(--brand-font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Utility helpers consumed by pages */
.text-brand { color: var(--brand-primary); }
.bg-brand { background-color: var(--brand-primary); }
.border-brand { border-color: var(--brand-primary); }

                    <div class="p-4 border-t border-border bg-card" data-dom-id="chat-input-area">
                        <form class="flex items-end gap-3" onsubmit="event.preventDefault();">
                            <button type="button" class="inline-flex items-center justify-center w-10 h-10 rounded-md text-muted-foreground hover:text-foreground hover:bg-muted focus-visible:ring-2 focus-visible:ring-ring shrink-0" aria-label="发送图片">
                                <i data-lucide="image-plus" class="w-5 h-5"></i>
                            </button>
                            <div class="flex-1">
                                <textarea class="msg-input" rows="1" placeholder="输入消息…" aria-label="消息输入框"></textarea>
                            </div>
                            <button type="submit" class="inline-flex items-center justify-center gap-2 h-10 px-5 rounded-md bg-primary text-primary-foreground font-semibold hover:bg-[var(--brand-primary-hover)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring shrink-0" data-dom-id="chat-send-btn">
                                <span>发送</span>
                                <i data-lucide="send" class="w-4 h-4"></i>
                            </button>
                        </form>
                    </div>
                </section>
            </div>
        </section>

        <!-- 简化页脚 -->
        <footer class="py-6 border-t border-border bg-background">
            <div class="max-w-7xl mx-auto px-4 text-center text-sm text-muted-foreground">
                <p>&copy; 2026 硬件侠. All rights reserved.</p>
            </div>
        </footer>

        <script>
            function showChat() {
                document.getElementById('msgShell').classList.add('show-detail');
            }
            function showList() {
                document.getElementById('msgShell').classList.remove('show-detail');
            }
        </script>
    </main>
    <script>lucide.createIcons();</script>
    <script>
        (function() {
            const page = location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-link[href]').forEach(function(a) {
                if (a.getAttribute('href') === page) a.classList.add('active');
            });
            const menu = document.getElementById('mobile-menu');
            const panel = document.getElementById('mobile-menu-panel');
            const toggle = document.getElementById('mobile-menu-toggle');
            const closeBtn = document.getElementById('mobile-menu-close');
            const backdrop = document.getElementById('mobile-menu-backdrop');
            function openMenu() {
                menu.classList.remove('hidden');
                menu.setAttribute('aria-hidden', 'false');
                if (toggle) { toggle.setAttribute('aria-expanded', 'true'); }
                requestAnimationFrame(function() { panel.classList.remove('translate-x-full'); });
            }
            function closeMenu() {
                panel.classList.add('translate-x-full');
                setTimeout(function() {
                    menu.classList.add('hidden');
                    menu.setAttribute('aria-hidden', 'true');
                    if (toggle) { toggle.setAttribute('aria-expanded', 'false'); }
                }, 200);
            }
            if (toggle) toggle.addEventListener('click', openMenu);
            if (closeBtn) closeBtn.addEventListener('click', closeMenu);
            if (backdrop) backdrop.addEventListener('click', closeMenu);
        })();
    </script>
</body>
