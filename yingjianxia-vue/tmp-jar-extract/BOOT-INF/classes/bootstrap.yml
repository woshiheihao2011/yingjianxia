# ============================================================
# 用户服务 user-service 启动配置（Spring Cloud 引导阶段）
# 开发期使用本地配置；生产/测试配置请迁移到 Nacos 配置中心
# ============================================================
spring:
  application:
    name: user-service
  profiles:
    active: dev

  # ---------- Nacos 注册发现 ----------
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: YINGJIANXIA_GROUP
        username: nacos
        password: nacos
        enabled: true
      # Nacos 配置中心（可选，启动时拉取共享/本服务配置）
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: YINGJIANXIA_GROUP
        username: nacos
        password: nacos
        file-extension: yaml
        shared-configs:
          - data-id: shared-common.yaml
            group: YINGJIANXIA_GROUP
            refresh: true

# ============================================================
# 以下配置在无 Nacos 的本地开发环境下直接生效
#（Nacos 中同项会覆盖本地值）
# ============================================================
---
spring:
  config:
    activate:
      on-profile: dev

  # ---------- 数据源（用户域独立库 db_user） ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/db_user?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PWD:123456}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 30
      idle-timeout: 300000
      pool-name: UserServiceHikariPool

  # ---------- Redis / Redisson ----------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PWD:123456}
      database: 0
      timeout: 5000ms
  # Redisson 单节点配置（与 spring.data.redis 兼容）
  redisson:
    single-server-config:
      address: "redis://${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}"
      password: "${REDIS_PWD:123456}"
      database: 0
      connection-minimum-idle-size: 5
      connection-pool-size: 30

# ---------- HTTP 服务端口 ----------
server:
  port: 8081
  servlet:
    context-path: /

# ---------- JWT 配置（生产必须放 Nacos 并加密） ----------
yingjianxia:
  jwt:
    secret: "yingjianxia-user-service-secret-key-2026-please-change-in-production-a1b2c3d4"
    access-expire: 7200000      # 2小时
    refresh-expire: 604800000    # 7天
    issuer: yingjianxia-platform

# ---------- MyBatis Plus ----------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 开发期打印SQL
  global-config:
    banner: false
    db-config:
      id-type: assign_id       # 雪花ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- XXL-Job 执行器 ----------
xxl:
  job:
    admin:
      addresses: http://${XXL_JOB_ADMIN:127.0.0.1:8080}/xxl-job-admin
    executor:
      appname: user-service-executor
      address:
      ip:
      port: 9991
      logpath: ./logs/xxl-job/user-service
      logretentiondays: 30
    accessToken: default_token

# ---------- Knife4j / Swagger ----------
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn
  production: false

# ---------- 日志 ----------
logging:
  level:
    root: INFO
    com.yingjianxia.user: DEBUG
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{traceId}] %msg%n"
